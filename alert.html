<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield Security Alerts</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .alert {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border-left: 6px solid;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .high {
            border-color: #d32f2f;
        }

        .medium {
            border-color: #f9a825;
        }

        .low {
            border-color: #388e3c;
        }

        .alert h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🛡️ CyberShield Security Alerts</h1>

        <div class="alert high">
            <h2>High Risk Alert</h2>
            <p>Suspicious login activity has been detected.</p>
            <strong>Status: Investigate immediately</strong>
        </div>

        <div class="alert medium">
            <h2>Medium Risk Alert</h2>
            <p>An unusual login attempt was detected.</p>
            <strong>Status: Review activity</strong>
        </div>

        <div class="alert low">
            <h2>Low Risk Alert</h2>
            <p>Security system is operating normally.</p>
            <strong>Status: Monitoring</strong>
        </div>

    </div>

</body>
</html>
